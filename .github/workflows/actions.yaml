name: Darling CI

on: [push, pull_request]

# Supersede in-flight runs for the same branch/PR, but never cancel a build of
# the default branch -- those runs publish the daily packages.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  # Builds of branches in this repository wait for a maintainer's approval in
  # the ci-approval environment. Pushes to the default branch run without it,
  # and pull requests from forks are left to the repository's fork approval
  # setting, so they aren't approved twice.
  approval:
    if: >-
      !(github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) &&
      !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    environment: ci-approval
    steps:
    - run: echo "Approved"

  build-deb:
    needs: approval
    if: ${{ !cancelled() && (needs.approval.result == 'success' || needs.approval.result == 'skipped') }}
    # The Mach-O part of Darling is the same for every host, so it is built once,
    # on amd64, with i386, x86_64 and arm64 slices: the Architecture: all
    # packages. darling-core-native, the parts that run on Linux, is built
    # natively on each architecture: the amd64 job builds both kinds, the arm64
    # runner (a regular arm64 Linux machine, no cross toolchain) only its own
    # darling-core-native. The assemble-debs job puts the sets together.
    name: Build DEBs (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runs-on: ubuntu-latest
          make-deb-args: ''
        - arch: arm64
          runs-on: ubuntu-26.04-arm
          make-deb-args: --arch-only
    runs-on: ${{ matrix.runs-on }}
    steps:
    - name: Checkout Darling
      uses: actions/checkout@v4

    # actions/checkout fetches submodules one at a time, which is slow with the
    # number of submodules this repo has. Fetch them ourselves in parallel.
    - name: Checkout submodules
      run: git submodule update --init --recursive --depth 1 --jobs 8

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install devscripts equivs debhelper ccache
        sudo mk-build-deps -i -r -t "apt-get --no-install-recommends -y" debian/control

    # see https://github.com/actions/virtual-environments/issues/2606#issuecomment-772683150
    - name: Free up space
      run: |
        sudo rm -rf /usr/share/dotnet

    # debuild runs the build with a scrubbed environment, so configure ccache
    # system-wide rather than relying on CCACHE_* reaching the compiler.
    # The mtime sloppiness settings matter in CI: a fresh checkout gives every
    # file a current timestamp, which would otherwise make ccache refuse to
    # cache the results. max_size has to hold a whole build's objects: when the
    # cache is smaller, ccache evicts entries while it writes new ones, and the
    # later part of every build misses.
    - name: Configure ccache
      run: |
        sudo tee /etc/ccache.conf > /dev/null <<EOF
        cache_dir = ${HOME}/.ccache
        max_size = 5G
        compiler_check = content
        sloppiness = time_macros,include_file_mtime,include_file_ctime
        EOF

    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: ~/.ccache
        key: ccache-deb-${{ matrix.arch }}-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          ccache-deb-${{ matrix.arch }}-${{ github.event.repository.default_branch }}-

    - name: Build DEBs
      run: |
        ccache --zero-stats
        ./tools/debian/make-deb ${{ matrix.make-deb-args }}

    - name: ccache statistics
      if: always()
      run: ccache --show-stats --verbose

    # Only pushes to the default branch save a cache; every other run restores
    # the default branch's. The repository's cache storage is limited, and a
    # cache per branch and pull request would evict the one all builds share.
    # Saved even when the build fails, so that a long build that dies near the
    # end still leaves its object files behind for the next run.
    - name: Save ccache
      if: always() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: actions/cache/save@v4
      with:
        path: ~/.ccache
        key: ccache-deb-${{ matrix.arch }}-${{ github.ref_name }}-${{ github.run_id }}

    - name: Move DEBs
      run: |
        mkdir dist && mv ../*.deb dist

    - name: Upload artifacts
      uses: actions/upload-artifact@v4.1.0
      with:
        name: debs-build-${{ matrix.arch }}
        path: dist/
        retention-days: 1

  # One installable set per host architecture, under the artifact names the
  # daily packages are published from: "debs" (amd64) and "debs-arm64", each
  # with the Architecture: all packages and its own darling-core-native. A set
  # is uploaded when the builds it needs succeeded, so a failing arm64 build
  # does not hold back the amd64 set.
  assemble-debs:
    needs: build-deb
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
    - name: Download amd64 build
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: debs-build-amd64
        path: build-amd64

    - name: Download arm64 build
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: debs-build-arm64
        path: build-arm64

    - name: Assemble the sets
      id: sets
      run: |
        set -e
        if ls build-amd64/*_all.deb > /dev/null 2>&1; then
          mkdir debs
          cp build-amd64/*_all.deb build-amd64/*_amd64.deb debs/
          echo "amd64=true" >> "$GITHUB_OUTPUT"
          if ls build-arm64/*_arm64.deb > /dev/null 2>&1; then
            mkdir debs-arm64
            cp build-amd64/*_all.deb build-arm64/*_arm64.deb debs-arm64/
            echo "arm64=true" >> "$GITHUB_OUTPUT"
          fi
        fi
        ls -l debs debs-arm64 2> /dev/null || true

    - name: Upload amd64 set
      if: steps.sets.outputs.amd64 == 'true'
      uses: actions/upload-artifact@v4.1.0
      with:
        name: debs
        path: debs/

    - name: Upload arm64 set
      if: steps.sets.outputs.arm64 == 'true'
      uses: actions/upload-artifact@v4.1.0
      with:
        name: debs-arm64
        path: debs-arm64/

    # A set that could not be put together fails the run after the others are uploaded
    - name: Check that both sets were assembled
      run: |
        test "${{ steps.sets.outputs.amd64 }}" = true
        test "${{ steps.sets.outputs.arm64 }}" = true

  build-dsc:
    needs: approval
    if: ${{ !cancelled() && (needs.approval.result == 'success' || needs.approval.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Darling
      uses: actions/checkout@v4

    # actions/checkout fetches submodules one at a time, which is slow with the
    # number of submodules this repo has. Fetch them ourselves in parallel.
    - name: Checkout submodules
      run: git submodule update --init --recursive --depth 1 --jobs 8

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install devscripts equivs debhelper

    - name: Build DSCs
      run: |
        ./tools/debian/make-deb --dsc

    - name: Move DSCs
      run: |
        mkdir source && mv ../*~$(lsb_release -cs)[-._]* source

    - name: Upload artifacts
      uses: actions/upload-artifact@v4.1.0
      with:
        name: 'deb-source'
        path: source/

  create-source-artifact:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Darling
      uses: actions/checkout@v4
      with:
        path: source/darling

    - name: Checkout submodules
      working-directory: source/darling
      run: git submodule update --init --recursive --depth 1 --jobs 8

    - name: Compress source
      run: |
        mkdir -v archive
        tar --create --use-compress-program="xz -9e" --verbose \
            --file archive/darling-source.tar.xz \
            --exclude=.git --exclude=.gitmodules --exclude=.gitignore \
            --directory=source \
            darling

    - name: Upload artifacts
      uses: actions/upload-artifact@v4.1.0
      with:
        name: 'source'
        path: archive/
